<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustGate — Sign In</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 20px;
  }
  .login-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    width: 100%;
    max-width: 440px;
    padding: 36px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  }
  .login-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    text-decoration: none;
    color: #fff;
  }
  .login-brand-mark {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 18px;
  }
  .role-toggle {
    display: flex;
    background: #0f172a;
    border-radius: 8px;
    padding: 4px;
    margin-bottom: 24px;
  }
  .role-btn {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    color: #94a3b8;
    font-weight: 600;
    font-size: 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .role-btn.active {
    background: #2563eb;
    color: #ffffff;
  }
  .field {
    margin-bottom: 20px;
  }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #94a3b8;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 12px 14px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    box-sizing: border-box;
    outline: none;
    transition: border 0.2s;
  }
  .field input:focus {
    border-color: #3b82f6;
  }
  .submit-btn {
    width: 100%;
    padding: 12px;
    background: #2563eb;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .submit-btn:hover {
    background: #1d4ed8;
  }
  .error-box {
    display: none;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid #ef4444;
    color: #fca5a5;
    padding: 12px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .demo-hint {
    margin-top: 20px;
    padding: 12px;
    background: rgba(59, 130, 246, 0.1);
    border: 1px solid rgba(59, 130, 246, 0.2);
    border-radius: 8px;
    font-size: 12px;
    color: #93c5fd;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="login-card">
  <a class="login-brand" href="index.html">
    <div class="login-brand-mark">TG</div>
    <div>
      <div style="font-weight: 700; font-size: 18px;">TrustGate</div>
      <div style="font-size: 11px; color: #94a3b8;">Verification Ledger</div>
    </div>
  </a>

  <div class="role-toggle">
    <button type="button" class="role-btn active" id="btnRoleIndividual" onclick="setRole('individual')">👤 Individual</button>
    <button type="button" class="role-btn" id="btnRoleOrg" onclick="setRole('organization')">🏛 Organization</button>
  </div>

  <div id="errorBox" class="error-box"></div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <input type="hidden" id="authRole" value="individual">

    <div class="field">
      <label id="emailLabel">Individual Email Address</label>
      <input type="email" id="authEmail" required placeholder="rohan.k@trustgate.id">
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" id="authPassword" required placeholder="••••••••">
    </div>

    <button type="submit" class="submit-btn" id="btnSubmit">Sign in →</button>
  </form>

  <div class="demo-hint" id="demoHint">
    <strong>Demo Credentials:</strong><br>
    <span id="demoText">Email: <code>rohan.k@trustgate.id</code> | Password: <code>password123</code></span>
  </div>
</div>

<script>
  function setRole(role) {
    document.getElementById('authRole').value = role;
    const btnInd = document.getElementById('btnRoleIndividual');
    const btnOrg = document.getElementById('btnRoleOrg');
    const emailLabel = document.getElementById('emailLabel');
    const emailInput = document.getElementById('authEmail');
    const demoText = document.getElementById('demoText');

    if (role === 'individual') {
      btnInd.classList.add('active');
      btnOrg.classList.remove('active');
      emailLabel.textContent = 'Individual Email Address';
      emailInput.placeholder = 'rohan.k@trustgate.id';
      demoText.innerHTML = 'Email: <code>rohan.k@trustgate.id</code> | Password: <code>password123</code>';
    } else {
      btnOrg.classList.add('active');
      btnInd.classList.remove('active');
      emailLabel.textContent = 'Organization Staff Email';
      emailInput.placeholder = 'priya.m@cgh.org';
      demoText.innerHTML = 'Email: <code>priya.m@cgh.org</code> | Password: <code>password123</code>';
    }
  }

  // Parse URL query parameter ?role=
  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const roleParam = params.get('role');
    if (roleParam === 'organization' || roleParam === 'org') {
      setRole('organization');
    } else {
      setRole('individual');
    }
  });

  async function handleLogin(e) {
    e.preventDefault();
    const errorBox = document.getElementById('errorBox');
    errorBox.style.display = 'none';

    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const role = document.getElementById('authRole').value;

    if (!email || !password) {
      errorBox.textContent = 'Please fill in both email and password.';
      errorBox.style.display = 'block';
      return;
    }

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, role })
      });

      const data = await res.json();

      if (res.ok) {
        if (role === 'organization') {
          window.location.href = 'organization.html';
        } else {
          window.location.href = 'individual.html';
        }
      } else {
        errorBox.textContent = data.message || 'Login failed. Please check your credentials.';
        errorBox.style.display = 'block';
      }
    } catch (err) {
      console.error('Login request error:', err);
      errorBox.textContent = 'Failed to connect to authentication server.';
      errorBox.style.display = 'block';
    }
  }
</script>

</body>
</html>
